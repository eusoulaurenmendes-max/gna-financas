<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="format-detection" content="telephone=no"><meta name="theme-color" content="#eef4ee" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0a140e" media="(prefers-color-scheme: dark)"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="GNA Finanças"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}img{max-width:100%}body{margin:0;font-family:-apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%}@media (max-width:900px){input,select,textarea{font-size:16px!important}}.install-hint{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 8px);z-index:45;background:var(--side);color:var(--side-ink);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);font-size:.9rem}.install-hint .icon-btn{color:var(--side-ink);flex:none}</style></head><body>
<title>GNA Finanças</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: livro-caixa da família — painel lateral verde-floresta + área de trabalho clara; no celular vira barra inferior + botão flutuante. */
:root{
  --bg:#eef4ee; --surface:#ffffff; --surface-2:#e4eee5; --ink:#11261a; --muted:#56695c; --line:#d3e0d4;
  --brand:#1d6b42; --brand-strong:#14532f; --brand-ink:#ffffff; --brand-soft:#d4ecdc;
  --side:#0f3a25; --side-ink:#e6f4ea; --side-muted:#9cc3aa; --side-active:#1f5c3c;
  --in:#1b8a4b; --out:#b4441f; --warn:#b7791f; --shadow:0 1px 2px rgba(15,58,37,.06),0 6px 20px rgba(15,58,37,.07);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0a140e; --surface:#122019; --surface-2:#18291f; --ink:#e2efe5; --muted:#92a99a; --line:#24392c;
  --brand:#4cc383; --brand-strong:#6bd69a; --brand-ink:#05190d; --brand-soft:#1c3a29;
  --side:#07100b; --side-ink:#dcefe2; --side-muted:#7fa48c; --side-active:#173826;
  --in:#5bd08f; --out:#f08a63; --warn:#e8b04f; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0a140e; --surface:#122019; --surface-2:#18291f; --ink:#e2efe5; --muted:#92a99a; --line:#24392c;
  --brand:#4cc383; --brand-strong:#6bd69a; --brand-ink:#05190d; --brand-soft:#1c3a29;
  --side:#07100b; --side-ink:#dcefe2; --side-muted:#7fa48c; --side-active:#173826;
  --in:#5bd08f; --out:#f08a63; --warn:#e8b04f; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,3vw,2.1rem);font-weight:800}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:20px;max-width:1280px;margin:0 auto;align-items:start}
.side{position:sticky;top:max(16px,env(safe-area-inset-top,0px));background:var(--side);color:var(--side-ink);border-radius:20px;padding:22px 14px;display:flex;flex-direction:column;gap:22px;min-height:calc(100vh - 32px)}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px}
.logo svg{flex:none}
.logo b{font-family:var(--f-display);font-size:1.25rem;font-weight:800;line-height:1.1}
.logo small{display:block;color:var(--side-muted);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--side-ink);text-decoration:none;font-weight:600}
.nav a:hover{background:var(--side-active)}
.nav a[aria-current="page"]{background:var(--side-active);box-shadow:inset 3px 0 0 #7fe0a8}
.nav svg{width:18px;height:18px;flex:none;opacity:.9}
.side .add{margin-top:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-strong)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--out)}
.btn.sm{padding:6px 10px;font-size:.85rem;border-radius:8px}
.side .btn.primary{background:#7fe0a8;border-color:#7fe0a8;color:#08301b;width:100%;padding:12px}
.sync{font-size:.78rem;color:var(--side-muted);padding:0 8px;display:flex;gap:6px;align-items:center}
.sync i{width:8px;height:8px;border-radius:50%;background:#7fe0a8;display:inline-block}

main{min-width:0;display:flex;flex-direction:column;gap:18px;padding-bottom:24px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.kpi .l{font-size:.78rem;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:1.45rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:.8rem;color:var(--muted)}
.hero{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.hero .l,.hero .s{color:inherit;opacity:.85}
.up{color:var(--out)} .down{color:var(--in)}
.pos{color:var(--in)} .neg{color:var(--out)}
.muted{color:var(--muted)}

/* barras horizontais */
.hbars{display:flex;flex-direction:column;gap:12px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:baseline}
.hb .n{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600}
.hb .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .val{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.hb .val small{color:var(--muted);font-weight:500;margin-left:6px}
.track{grid-column:1/-1;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;position:relative}
.track b{display:block;height:100%;border-radius:99px}
.track .lim{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.5}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.hb .meta{grid-column:1/-1;font-size:.8rem;color:var(--muted)}

/* colunas */
.cols{display:flex;align-items:flex-end;gap:3px;height:170px;padding-top:8px;border-bottom:1px solid var(--line);position:relative}
.cols .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0;position:relative}
.cols .c b{display:block;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
.cols .c.hl b{opacity:1;background:var(--brand-strong)}
.cols .c.zero b{background:var(--line)}
.cols .c:hover b{opacity:1}
.gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line);font-size:.7rem;color:var(--muted)}
.gl span{position:absolute;right:0;top:-1.25em;background:var(--surface);padding-left:4px}
.xl{display:flex;gap:3px;margin-top:6px}
.xl span{flex:1;text-align:center;font-size:.7rem;color:var(--muted);min-width:0;overflow:hidden}

.donut-wrap{display:grid;grid-template-columns:180px minmax(0,1fr);gap:18px;align-items:center}
.donut-wrap svg{width:100%;max-width:180px;height:auto}

/* lista de lançamentos */
.day{display:flex;flex-direction:column}
.day-h{display:flex;justify-content:space-between;align-items:baseline;padding:10px 4px 6px;border-bottom:1px solid var(--line);font-size:.85rem}
.day-h b{font-family:var(--f-display);font-size:.95rem}
.tx{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:.8rem;font-family:var(--f-display)}
.tx .d{min-width:0}
.tx .d b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .d small{color:var(--muted);font-size:.8rem}
.tx .amt{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
.tx .acts{display:flex;gap:4px}
.who{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.who i{font-style:normal;font-size:.68rem;font-weight:700;border-radius:99px;padding:1px 7px;color:#fff}
.icon-btn{border:0;background:transparent;border-radius:8px;padding:6px;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn.armed{background:var(--out);color:#fff;font-size:.75rem;font-weight:700;padding:6px 8px}

.filters{display:flex;flex-wrap:wrap;gap:10px}
.filters>*{flex:1 1 150px;min-width:0}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lab{font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
input[type=text],input[type=date],input[type=number],input[type=month],select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-width:0}
input:focus,select:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}

.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:7px 14px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.pager{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pager .lbl{font-family:var(--f-display);font-weight:700;font-size:1.1rem;min-width:0}
.leg .hb{grid-template-columns:minmax(0,1fr)}
.leg .hb .val{text-align:left;font-size:.88rem;padding-left:18px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.88rem;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--ink)}

.empty{text-align:center;padding:36px 18px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty p{max-width:52ch;margin:0;color:var(--muted)}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--out) 16%,transparent);color:var(--out)}
.pill.ok{background:color-mix(in srgb,var(--in) 16%,transparent);color:var(--in)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(6,20,12,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.sheet{background:var(--surface);border-radius:18px;width:min(560px,100%);max-height:calc(100% - 16px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sheet .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.amount-in{font-family:var(--f-display);font-size:1.8rem !important;font-weight:700;padding:10px 14px !important}
.typesw{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px}
.typesw button{border:0;border-radius:9px;padding:9px;font-weight:700;cursor:pointer;background:transparent;color:var(--muted)}
.typesw button[aria-pressed="true"][data-t="out"]{background:var(--out);color:#fff}
.typesw button[aria-pressed="true"][data-t="in"]{background:var(--in);color:#fff}
.splitbox{border:1px dashed var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.splitrow{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:10px;align-items:center}
.err{color:var(--out);font-size:.85rem;font-weight:600}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}

.set-row{display:grid;grid-template-columns:auto minmax(0,1.4fr) minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row input[type=color]{width:36px;height:36px;border:1px solid var(--line);border-radius:10px;padding:2px;background:var(--surface);cursor:pointer}

/* importação de extrato */
.side .side-imp{width:100%;margin-top:8px;background:transparent;color:var(--side-ink);border-color:var(--side-active)}
.side .side-imp:hover{border-color:#7fe0a8}
.sheet.wide{width:min(1000px,100%)}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.drop{position:relative;border:2px dashed var(--line);border-radius:14px;padding:32px 18px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;cursor:pointer;color:var(--ink)}
.drop:hover,.drop.over,.drop:focus-within{border-color:var(--brand);background:var(--brand-soft)}
.imp-sum{display:flex;flex-wrap:wrap;gap:6px}
.imp-ctl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;align-items:end}
.ck{display:flex;gap:8px;align-items:center;font-size:.88rem;font-weight:600;cursor:pointer}
.ck input,table.imp input[type=checkbox]{width:17px;height:17px;accent-color:var(--brand)}
.tblwrap{overflow:auto;max-height:50vh;border:1px solid var(--line);border-radius:12px}
table.imp{width:100%;border-collapse:collapse;font-size:.86rem;min-width:760px}
table.imp th{position:sticky;top:0;background:var(--surface-2);text-align:left;padding:8px;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;z-index:1}
table.imp td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:middle}
table.imp td.dsc{max-width:300px}
table.imp td.dsc span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.imp td.amt-c{text-align:right;font-weight:700;white-space:nowrap}
table.imp select{padding:5px 8px;font-size:.84rem;border-radius:8px}
table.imp tr.off td{opacity:.5}
@media (max-width:560px){ .imp-ctl{grid-template-columns:1fr} }

.mob{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.grid3{grid-template-columns:1fr}
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .mob{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--side);
    padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));justify-content:space-around;gap:4px}
  .mob a{color:var(--side-muted);text-decoration:none;font-size:.7rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;border-radius:10px;flex:1}
  .mob a[aria-current="page"]{color:#7fe0a8;background:var(--side-active)}
  .mob svg{width:20px;height:20px}
  .fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:41;width:56px;height:56px;border-radius:18px;border:0;background:var(--brand);color:var(--brand-ink);box-shadow:0 8px 24px rgba(15,58,37,.35);display:grid;place-items:center;cursor:pointer}
  .mob-head{display:flex}
}
@media (min-width:901px){ .fab,.mob-head{display:none} }
.mob-head{align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.15rem;color:var(--brand-strong)}
@media (max-width:560px){
  .donut-wrap{grid-template-columns:1fr;justify-items:center}
  .donut-wrap .hbars{width:100%}
  .tx{grid-template-columns:auto minmax(0,1fr) auto}
  .tx .acts{grid-column:2/-1;justify-content:flex-end;margin-top:-6px}
  .sheet .row{grid-template-columns:1fr}
  .set-row{grid-template-columns:auto minmax(0,1fr) auto;}
  .set-row .wide{grid-column:2/-1}
  .kpi .v{font-size:1.2rem}
}
@media (prefers-reduced-motion:no-preference){ .track b,.cols .c b{transition:height .3s,width .3s} }
</style>

<div class="shell">
  <aside class="side" aria-label="Menu">
    <div class="logo">
      <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="10" fill="#7fe0a8"/><path d="M10 9h13a3 3 0 0 1 3 3v15H13a3 3 0 0 1-3-3z" fill="#0f3a25"/><path d="M14 15h8M14 19h8M14 23h5" stroke="#7fe0a8" stroke-width="2" stroke-linecap="round"/></svg>
      <div><b>GNA Finanças</b><small>organização da família</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="add"><button class="btn primary" data-action="new">+ Novo lançamento</button><button class="btn side-imp" data-action="import">Importar extrato</button></div>
    <div class="sync" id="sync"><i></i><span>Carregando…</span></div>
  </aside>
  <main id="view" aria-live="polite"></main>
</div>
<nav class="mob" id="mobnav" aria-label="Menu"></nav>
<button class="fab" data-action="new" aria-label="Novo lançamento"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></button>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BRL = new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'});
const money = v => BRL.format(v || 0);
const pct = v => (isFinite(v) ? Math.round(v * 100) : 0) + '%';
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d || 1); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = () => ymd(new Date());
const newId = () => 'e_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const WD = ['dom','seg','ter','qua','qui','sex','sáb'];
const WDL = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const sum = (list, f = e => e.amount) => list.reduce((a, e) => a + (+f(e) || 0), 0);
const PAYS = ['Pix','Débito','Crédito','Dinheiro','Boleto'];
const ROLES = ['Titular','Esposa','Marido','Filho','Filha','Outro'];
const initials = n => (n || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
function parseMoney(s){ s = String(s).trim().replace(/[R$\s]/g, ''); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); const n = parseFloat(s); return isFinite(n) ? Math.round(n * 100) / 100 : NaN; }
function longDate(s){ const d = parse(s); return `${WDL[d.getDay()]}, ${d.getDate()} de ${MONTHS[d.getMonth()]}`; }
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function shortDate(s){ const d = parse(s); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}`; }

const S = {

const LKEY = 'caderno-verde.v1';
// No iPhone os dados ficam no armazenamento do app (Preferences), que entra no backup do iCloud do aparelho.
const Prefs = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() ? window.Capacitor.registerPlugin('Preferences') : null;
async function bootNative(){ if (!Prefs) return; try { const r = await Prefs.get({key:LKEY}); if (r && r.value) localStorage.setItem(LKEY, r.value); } catch {} }
let DB = null, BASE = null;

function normalizeSettings(s){
  const out = clone(DEFAULTS);
  if (Array.isArray(s.members) && s.members.length) out.members = s.members;
  if (Array.isArray(s.categories) && s.categories.length) out.categories = s.categories;
  out.rules = Array.isArray(s.rules) ? s.rules : [];
  return out;
}
const member = id => S.settings.members.find(m => m.id === id) || {id, name:'(removido)', color:'#8a948d'};
const cat = id => S.settings.categories.find(c => c.id === id) || {id, name:'Sem categoria', color:'#8a948d'};

function loadLocal(){
  try { const raw = localStorage.getItem(LKEY); if (raw){ const d = JSON.parse(raw); if (d.settings) { S.settings = normalizeSettings(d.settings); S.settingsSaved = true; } S.entries = Array.isArray(d.entries) ? d.entries : []; } } catch {}
}
function saveLocal(){ const v = JSON.stringify({settings:S.settings, entries:S.entries}); try { localStorage.setItem(LKEY, v); } catch {} if (Prefs) Prefs.set({key:LKEY, value:v}).catch(() => toast('Não foi possível salvar no aparelho.')); }

async function initStore(){
  let db = null, user = null, uid = null;
  try { if (window.claude && window.claude.use) [db, user] = await Promise.all([claude.use('db'), claude.use('user')]); } catch {}
  try { uid = user ? await user.id() : null; } catch {}
  if (db && uid){
    DB = db; BASE = 'data/users/' + uid; S.mode = 'db';
    DB.collection(BASE).onSnapshot(snap => {
      const entries = []; let settings = null;
      snap.docs.forEach(d => { const v = d.data(); if (!v) return; if (d.id === 'settings') settings = v; else if (v.kind === 'entry') entries.push({...v, id:d.id}); });
      if (settings){ S.settings = normalizeSettings(settings); S.settingsSaved = true; }
      S.entries = entries; S.ready = true; render();
    }, err => { toast('Sincronização interrompida. Os dados passam a ser salvos neste navegador.'); S.mode = 'local'; loadLocal(); S.ready = true; render(); });
  } else { S.mode = 'local'; loadLocal(); S.ready = true; render(); }
}
async function saveSettings(){
  S.settingsSaved = true;
  if (S.mode === 'db'){ try { await DB.doc(BASE + '/settings').set(clone(S.settings)); } catch(e){ toast('Não foi possível salvar: ' + (e.message || e.code)); } }
  else saveLocal();
  render();
}
async function putEntry(e){
  const body = {...e}; delete body.id;
  if (S.mode === 'db'){
    if (!S.settingsSaved) await saveSettings();
    try { await DB.collection(BASE).doc(e.id).set(body); } catch(err){ toast(err.code === 'quota_exceeded' ? 'Limite de armazenamento atingido. Apague lançamentos antigos.' : 'Não foi possível salvar o lançamento.'); }
  } else {
    const i = S.entries.findIndex(x => x.id === e.id); if (i >= 0) S.entries[i] = e; else S.entries.push(e);
    S.settingsSaved = true; saveLocal(); render();
  }
}
async function removeEntry(id){
  if (S.mode === 'db'){ try { await DB.collection(BASE).doc(id).delete(); } catch { toast('Não foi possível apagar.'); } }
  else { S.entries = S.entries.filter(e => e.id !== id); saveLocal(); render(); }
}

/* ---------- cálculos ---------- */
function shares(e){
  const sp = e.split || {}; const ids = Object.keys(sp).filter(k => +sp[k] > 0);
  if (!ids.length) return {[S.settings.members[0]?.id || '_']: e.amount};
  const tot = ids.reduce((a, k) => a + (+sp[k]), 0);
  const out = {}; ids.forEach(k => out[k] = e.amount * (+sp[k]) / tot); return out;
}
function rangeFor(mode, anchor){
  const d = parse(anchor);
  if (mode === 'day') return [anchor, anchor];
  if (mode === 'week'){ const s = addDays(d, -((d.getDay() + 6) % 7)); return [ymd(s), ymd(addDays(s, 6))]; }
  return [ymd(new Date(d.getFullYear(), d.getMonth(), 1)), ymd(new Date(d.getFullYear(), d.getMonth() + 1, 0))];
}
function shiftAnchor(mode, anchor, n){
  const d = parse(anchor);
  if (mode === 'day') return ymd(addDays(d, n));
  if (mode === 'week') return ymd(addDays(d, 7 * n));
  return ymd(new Date(d.getFullYear(), d.getMonth() + n, 1));
}
function periodLabel(mode, anchor){
  const [a, b] = rangeFor(mode, anchor); const d = parse(anchor);
  if (mode === 'day') return longDate(anchor) + (anchor === today() ? ' · hoje' : '');
  if (mode === 'week') return `Semana de ${shortDate(a)} a ${shortDate(b)}`;
  return `${MONTHS[d.getMonth()]} de ${d.getFullYear()}`;
}
function summarize(a, b){
  const list = S.entries.filter(e => e.date >= a && e.date <= b);
  const out = list.filter(e => e.type !== 'in'), inc = list.filter(e => e.type === 'in');
  const spent = sum(out), income = sum(inc);
  const byCat = {}, byPerson = {}, byPay = {}, byDay = {}, personCat = {};
  out.forEach(e => {
    byCat[e.cat] = (byCat[e.cat] || 0) + e.amount;
    byPay[e.pay || 'Outro'] = (byPay[e.pay || 'Outro'] || 0) + e.amount;
    byDay[e.date] = (byDay[e.date] || 0) + e.amount;
    Object.entries(shares(e)).forEach(([m, v]) => {
      byPerson[m] = (byPerson[m] || 0) + v;
      personCat[m] = personCat[m] || {}; personCat[m][e.cat] = (personCat[m][e.cat] || 0) + v;
    });
  });
  const days = Math.round((parse(b) - parse(a)) / 864e5) + 1;
  return {list, out, inc, spent, income, balance: income - spent, byCat, byPerson, byPay, byDay, personCat, days};
}
const sorted = obj => Object.entries(obj).sort((x, y) => y[1] - x[1]);

/* ---------- componentes de gráfico ---------- */
function donut(items, total, label){
  const r = 62, C = 2 * Math.PI * r; let off = 0;
  const segs = total > 0 ? items.map(([id, v]) => {
    const len = v / total * C; const c = cat(id).color;
    const s = `<circle cx="90" cy="90" r="${r}" fill="none" stroke="${c}" stroke-width="24" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 90 90)"><title>${esc(cat(id).name)}: ${money(v)}</title></circle>`;
    off += len; return s; }).join('') : '';
  return `<svg viewBox="0 0 180 180" role="img" aria-label="${esc(label)}"><circle cx="90" cy="90" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="24"/>${segs}
    <text x="90" y="84" text-anchor="middle" fill="var(--muted)" font-size="11" font-weight="600">${esc(label)}</text>
    <text x="90" y="104" text-anchor="middle" fill="var(--ink)" font-size="17" font-weight="700" font-family="Bricolage Grotesque, sans-serif">${esc(money(total).replace(/,\d\d$/, ''))}</text></svg>`;
}
function catBars(byCat, total, budgets){
  const rows = sorted(byCat);
  if (!rows.length) return `<p class="muted">Nenhum gasto neste período.</p>`;
  return `<div class="hbars">${rows.map(([id, v]) => {
    const c = cat(id); const b = budgets ? +c.budget || 0 : 0;
    const scale = Math.max(v, b, 1); const usage = b ? v / b : 0;
    const flag = b ? (usage > 1 ? `<span class="pill bad">${pct(usage)} do orçamento</span>` : usage > .8 ? `<span class="pill warn">${pct(usage)} do orçamento</span>` : `<span class="pill ok">${pct(usage)} do orçamento</span>`) : '';
    return `<div class="hb"><div class="n"><i class="dot" style="background:${c.color}"></i><span>${esc(c.name)}</span></div>
      <div class="val">${money(v)}<small>${pct(v / (total || 1))}</small></div>
      <div class="track"><b style="width:${(budgets && b ? v / scale : v / (rows[0][1] || 1)) * 100}%;background:${c.color}"></b>${b ? `<span class="lim" style="left:calc(${b / scale * 100}% - 1px)" title="Orçamento ${money(b)}"></span>` : ''}</div>
      ${b ? `<div class="meta">Orçamento ${money(b)} · ${v > b ? `passou ${money(v - b)}` : `restam ${money(b - v)}`} ${flag}</div>` : ''}</div>`; }).join('')}</div>`;
}
function personBars(sm){
  const members = S.settings.members;
  const ids = [...new Set([...members.map(m => m.id), ...Object.keys(sm.byPerson)])];
  const max = Math.max(1, ...ids.map(id => sm.byPerson[id] || 0));
  return `<div class="hbars">${ids.map(id => {
    const m = member(id); const v = sm.byPerson[id] || 0;
    const top = sorted(sm.personCat[id] || {}).slice(0, 3).map(([c, x]) => `${esc(cat(c).name)} ${money(x)}`).join(' · ');
    return `<div class="hb"><div class="n"><i class="dot" style="background:${m.color}"></i><span>${esc(m.name)}</span>${m.role ? `<span class="pill">${esc(m.role)}</span>` : ''}</div>
      <div class="val">${money(v)}<small>${pct(v / (sm.spent || 1))}</small></div>
      <div class="track"><b style="width:${v / max * 100}%;background:${m.color}"></b></div>
      <div class="meta">${top || 'Sem gastos no período'}</div></div>`; }).join('')}</div>`;
}
function columns(points){
  const max = Math.max(...points.map(p => p.v), 0);
  const nice = max <= 0 ? 100 : (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); return Math.ceil(max / p) * p; })();
  const step = Math.max(1, Math.ceil(points.length / 8));
  return `<div class="cols">
    <div class="gl" style="bottom:100%"><span>${money(nice).replace(/,00$/, '')}</span></div>
    <div class="gl" style="bottom:50%"><span>${money(nice / 2).replace(/,00$/, '')}</span></div>
    ${points.map(p => `<div class="c ${p.hl ? 'hl' : ''} ${p.v ? '' : 'zero'}" title="${esc(p.t)}: ${money(p.v)}"><b style="height:${p.v / nice * 100}%"></b></div>`).join('')}</div>
    <div class="xl">${points.map((p, i) => `<span>${i % step === 0 || p.hl ? esc(p.l) : ''}</span>`).join('')}</div>`;
}
function txRow(e){
  const c = cat(e.cat); const sh = Object.keys(shares(e));
  const who = sh.map(id => { const m = member(id); return `<i style="background:${m.color}" title="${esc(m.name)}">${esc(m.name.split(' ')[0])}</i>`; }).join('');
  return `<div class="tx"><div class="ic" style="background:color-mix(in srgb, ${c.color} 18%, transparent);color:${c.color}">${esc(initials(c.name))}</div>
    <div class="d"><b>${esc(e.desc || c.name)}</b><small>${esc(c.name)} · ${esc(e.pay || '')}${e.sample ? ' · exemplo' : ''}${e.source === 'extrato' ? ' · extrato' : ''}</small> <span class="who">${who}</span></div>
    <div class="amt ${e.type === 'in' ? 'pos' : ''}">${e.type === 'in' ? '+' : '−'} ${money(e.amount)}</div>
    <div class="acts"><button class="icon-btn" data-action="edit" data-id="${e.id}" aria-label="Editar">${ICONS.edit}</button><button class="icon-btn" data-action="del" data-id="${e.id}" aria-label="Apagar">${ICONS.del}</button></div></div>`;
}
function emptyState(){
  return `<div class="card empty"><svg width="64" height="64" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="10" fill="var(--brand-soft)"/><path d="M10 9h13a3 3 0 0 1 3 3v15H13a3 3 0 0 1-3-3z" fill="var(--brand)"/></svg>
    <h2>Nenhum lançamento ainda</h2>
    <p>Registre cada gasto do dia ou importe o extrato do banco, diga para quem foi (você, sua esposa, seu filho ou todos) e o GNA Finanças monta o rateio e os relatórios diário, semanal e mensal.</p>
    <div class="chips" style="justify-content:center"><button class="btn primary" data-action="new">+ Primeiro lançamento</button><button class="btn" data-action="import">Importar extrato do banco</button><button class="btn" data-action="sample">Ver com dados de exemplo</button></div>
    <p style="font-size:.85rem">Os dados de exemplo ficam marcados e podem ser removidos depois em Família e categorias.</p></div>`;
}

/* ---------- telas ---------- */
function viewPainel(){
  const t = today(); const [a, b] = rangeFor('month', t); const sm = summarize(a, b);
  const d = parse(t); const dayN = d.getDate(); const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  const todaySpent = sum(sm.out.filter(e => e.date === t));
  const avg = sm.spent / dayN; const proj = avg * dim;
  const budget = sum(S.settings.categories.filter(c => !c.income), c => c.budget);
  const yest = sum(S.entries.filter(e => e.type !== 'in' && e.date === ymd(addDays(d, -1))));
  const top = sorted(sm.byCat);
  const recent = [...S.entries].sort((x, y) => (y.date + (y.createdAt || '')).localeCompare(x.date + (x.createdAt || ''))).slice(0, 6);
  const head = `<div class="mob-head">GNA Finanças</div><div class="top"><div><div class="eyebrow">Painel do mês</div><h1>${cap(MONTHS[d.getMonth()])} de ${d.getFullYear()}</h1></div>
    <div class="chips"><button class="btn" data-action="goto" data-view="relatorios" data-mode="day">Relatório de hoje</button><button class="btn" data-action="import">Importar extrato</button><button class="btn primary" data-action="new">+ Lançar gasto</button></div></div>`;
  if (!S.entries.length) return head + emptyState();
  return head + `
  <div class="kpis">
    <div class="kpi hero"><div class="l">Saldo do mês</div><div class="v">${money(sm.balance)}</div><div class="s">Entrou ${money(sm.income)} · saiu ${money(sm.spent)}</div></div>
    <div class="kpi"><div class="l">Gasto hoje</div><div class="v num">${money(todaySpent)}</div><div class="s">Ontem: ${money(yest)}</div></div>
    <div class="kpi"><div class="l">Gasto no mês</div><div class="v num">${money(sm.spent)}</div><div class="s">${budget ? `${pct(sm.spent / budget)} do orçamento de ${money(budget)}` : 'Sem orçamento definido'}</div></div>
    <div class="kpi"><div class="l">Média por dia</div><div class="v num">${money(avg)}</div><div class="s">Projeção do mês: <b class="${budget && proj > budget ? 'neg' : ''}">${money(proj)}</b></div></div>
  </div>
  <div class="grid2">
    <section class="card"><div class="card-h"><h2>Para onde foi o dinheiro</h2><span class="pill">${sm.out.length} gastos</span></div>
      <div class="donut-wrap">${donut(top, sm.spent, 'gasto no mês')}
      <div class="hbars leg">${top.slice(0, 6).map(([id, v]) => `<div class="hb"><div class="n"><i class="dot" style="background:${cat(id).color}"></i><span>${esc(cat(id).name)}</span></div><div class="val">${money(v)}<small>${pct(v / (sm.spent || 1))}</small></div></div>`).join('')}</div></div></section>
    <section class="card"><div class="card-h"><h2>Rateio por pessoa</h2><button class="btn sm ghost" data-action="goto" data-view="familia">Editar nomes</button></div>${personBars(sm)}</section>
  </div>
  <div class="grid2">
    <section class="card"><div class="card-h"><h2>Orçamento por categoria</h2><span class="muted" style="font-size:.85rem">dia ${dayN} de ${dim}</span></div>${catBars(sm.byCat, sm.spent, true)}</section>
    <section class="card"><div class="card-h"><h2>Últimos lançamentos</h2><button class="btn sm ghost" data-action="goto" data-view="lancamentos">Ver todos</button></div>
      ${recent.map(e => `<div style="font-size:.78rem;color:var(--muted);margin-top:4px">${shortDate(e.date)}</div>` + txRow(e)).join('')}</section>
  </div>`;
}

  const f = S.filter;
  return `<div class="mob-head">GNA Finanças</div><div class="top"><div><div class="eyebrow">Livro-caixa</div><h1>Lançamentos</h1></div><div class="chips"><button class="btn" data-action="import">Importar extrato</button><button class="btn primary" data-action="new">+ Novo lançamento</button></div></div>
  <section class="card"><div class="filters">
    <div class="field"><label for="fq">Buscar</label><input type="text" id="fq" placeholder="Ex.: farmácia" value="${esc(f.q)}"></div>
    <div class="field"><label for="fm">Mês</label><input type="month" id="fm" value="${esc(f.month)}"></div>
    <div class="field"><label for="fc">Categoria</label><select id="fc"><option value="">Todas</option>${S.settings.categories.map(c => `<option value="${c.id}" ${f.cat === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div>
    <div class="field"><label for="fp">Pessoa</label><select id="fp"><option value="">Todas</option>${S.settings.members.map(m => `<option value="${m.id}" ${f.person === m.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select></div>
    <div class="field"><label for="ft">Tipo</label><select id="ft"><option value="">Gastos e entradas</option><option value="out" ${f.type === 'out' ? 'selected' : ''}>Só gastos</option><option value="in" ${f.type === 'in' ? 'selected' : ''}>Só entradas</option></select></div>
  </div></section>
  <section class="card" id="txList">${txListHTML()}</section>`;
}
function txListHTML(){
  const f = S.filter; const q = f.q.trim().toLowerCase();
  const list = S.entries.filter(e => (!f.month || e.date.startsWith(f.month)) && (!f.cat || e.cat === f.cat) && (!f.type || (f.type === 'in' ? e.type === 'in' : e.type !== 'in'))
    && (!f.person || shares(e)[f.person] > 0) && (!q || (e.desc || '').toLowerCase().includes(q) || cat(e.cat).name.toLowerCase().includes(q)))
    .sort((x, y) => (y.date + (y.createdAt || '')).localeCompare(x.date + (x.createdAt || '')));
  if (!S.entries.length) return emptyState();
  if (!list.length) return `<p class="muted">Nenhum lançamento com esses filtros.</p>`;
  const spent = sum(list.filter(e => e.type !== 'in'), e => f.person ? shares(e)[f.person] || 0 : e.amount);
  const inc = sum(list.filter(e => e.type === 'in'));
  const groups = {}; list.forEach(e => (groups[e.date] = groups[e.date] || []).push(e));
  return `<div class="card-h"><h2>${list.length} lançamentos</h2><div class="chips"><span class="pill bad">Gastos ${money(spent)}${f.person ? ' (parte de ' + esc(member(f.person).name) + ')' : ''}</span><span class="pill ok">Entradas ${money(inc)}</span></div></div>

}

    <div class="kpi"><div class="l">Maior categoria</div><div class="v" style="font-size:1.1rem">${sorted(sm.byCat)[0] ? esc(cat(sorted(sm.byCat)[0][0]).name) : '—'}</div><div class="s">${sorted(sm.byCat)[0] ? `${money(sorted(sm.byCat)[0][1])} · ${pct(sorted(sm.byCat)[0][1] / sm.spent)} do total` : 'Nenhum gasto'}</div></div>

/* ---------- dados de exemplo ---------- */
function rng(seed){ return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
function sampleEntries(){
  const r = rng(42); const ms = S.settings.members.map(m => m.id); const M = i => ms[Math.min(i, ms.length - 1)];
  const all = () => Object.fromEntries(ms.map(k => [k, 1]));
  const T = parse(today()); const list = [];
  const add = (date, desc, catId, amount, pay, split, type = 'out') => list.push({id:newId() + list.length, kind:'entry', sample:true, type, date:ymd(date), desc, cat:catId, amount:Math.round(amount * 100) / 100, pay, split, createdAt:new Date().toISOString()});
  const daily = [
    ['Padaria','c_alim',12,38,'Pix',() => all()],['Almoço no trabalho','c_alim',28,52,'Débito',() => ({[M(0)]:1})],
    ['Uber','c_transp',14,42,'Crédito',() => ({[M(1)]:1})],['Combustível','c_transp',120,240,'Crédito',() => ({[M(0)]:1})],
    ['Mercado da semana','c_merc',180,420,'Débito',() => all()],['Hortifruti','c_merc',35,90,'Pix',() => all()],
    ['Farmácia','c_saude',25,140,'Pix',() => ({[M(2)]:1})],['Lanche da escola','c_alim',10,25,'Dinheiro',() => ({[M(2)]:1})],
    ['Sorvete','c_lazer',18,45,'Pix',() => ({[M(1)]:1,[M(2)]:1})],['Cinema','c_lazer',60,120,'Crédito',() => all()],
    ['Roupa','c_vest',70,220,'Crédito',() => ({[M(1)]:1})],['Material escolar','c_edu',40,160,'Pix',() => ({[M(2)]:1})],
  ];
  for (let i = 0; i < 40; i++){
    const d = addDays(T, -i); const n = 1 + Math.floor(r() * 3);
    for (let j = 0; j < n; j++){ const t = daily[Math.floor(r() * daily.length)]; add(d, t[0], t[1], t[2] + r() * (t[3] - t[2]), t[4], t[5]()); }
  }
  [0, -1].forEach(mo => {
    const base = new Date(T.getFullYear(), T.getMonth() + mo, 1);
    const at = day => { const d = new Date(base.getFullYear(), base.getMonth(), day); return d <= T ? d : null; };
    const fixed = [[5,'Salário','c_renda',6800,'Pix',{[M(0)]:1},'in'],[5,'Salário','c_renda',3900,'Pix',{[M(1)]:1},'in'],
      [10,'Aluguel','c_casa',1900,'Boleto',all()],[8,'Mensalidade escolar','c_edu',890,'Boleto',{[M(2)]:1}],
      [12,'Conta de luz','c_contas',210,'Pix',all()],[12,'Conta de água','c_contas',95,'Pix',all()],[15,'Internet e celulares','c_contas',189.9,'Crédito',all()],
      [18,'Plano de saúde','c_saude',640,'Boleto',{[M(0)]:40,[M(1)]:35,[M(2)]:25}],[20,'Natação','c_edu',180,'Pix',{[M(2)]:1}]];
    fixed.forEach(([day, desc, c, v, p, sp, type]) => { const d = at(day); if (d) add(d, desc, c, v, p, sp, type || 'out'); });
  });
  return list;
}
async function loadSample(){
  const list = sampleEntries(); toast(`Carregando ${list.length} lançamentos de exemplo…`);
  if (S.mode === 'db'){ if (!S.settingsSaved) await saveSettings(); for (const e of list){ const b = {...e}; delete b.id; try { await DB.collection(BASE).doc(e.id).set(b); } catch { toast('Parte dos exemplos não foi salva.'); break; } } }
  else { S.entries.push(...list); S.settingsSaved = true; saveLocal(); render(); }
  toast('Exemplos carregados. Remova quando quiser em Família e categorias.');
}
async function removeMany(pred){
  const ids = S.entries.filter(pred).map(e => e.id);
  if (S.mode === 'db'){ for (const id of ids){ try { await DB.collection(BASE).doc(id).delete(); } catch { break; } } }
  else { S.entries = S.entries.filter(e => !pred(e)); saveLocal(); render(); }
  toast(`${ids.length} lançamentos removidos.`);
}

/* ---------- resumo em texto ---------- */
function summaryText(){
  const R = S.report; const [a, b] = rangeFor(R.mode, R.anchor); const sm = summarize(a, b);
  const t = {day:'Relatório diário', week:'Relatório semanal', month:'Relatório mensal'}[R.mode];
  const lines = [`${t} · ${periodLabel(R.mode, R.anchor)}`, `Gastos: ${money(sm.spent)} | Entradas: ${money(sm.income)} | Saldo: ${money(sm.balance)}`, '', 'Por categoria:'];
  sorted(sm.byCat).forEach(([c, v]) => lines.push(`• ${cat(c).name}: ${money(v)} (${pct(v / (sm.spent || 1))})`));
  lines.push('', 'Por pessoa:'); sorted(sm.byPerson).forEach(([m, v]) => lines.push(`• ${member(m).name}: ${money(v)}`));
  return lines.join('\n');
}

const KEYWORDS = [

    case 'backup': makeBackup(); break;
    case 'restore-go': applyRestore(); break;
    case 'madd': S.settings.members.push({id:'m_' + Date.now().toString(36), name:'Nova pessoa', role:'Outro', color:['#e0a526','#8b6cc9','#1aa3a3','#d0603f'][S.settings.members.length % 4]}); saveSettings(); break;
    case 'mdel': if (S.settings.members.length > 1){ S.settings.members.splice(i, 1); saveSettings(); } break;
    case 'cadd': S.settings.categories.splice(S.settings.categories.length - 1, 0, {id:'c_' + Date.now().toString(36), name:'Nova categoria', color:'#6b7a86', budget:0}); saveSettings(); break;
    case 'cdel': if (S.settings.categories.filter(c => !c.income).length > 1 || S.settings.categories[i].income){ if (S.settings.categories[i].income && S.settings.categories.filter(c => c.income).length < 2){ toast('Mantenha ao menos uma categoria de entradas.'); break; } S.settings.categories.splice(i, 1); saveSettings(); } break;
  }
});
function openFormRefresh(){
  // reconstrói o formulário mantendo o que já foi digitado ao trocar Gasto/Entrada
  const keep = F;
  const cats = S.settings.categories.filter(c => keep.type === 'in' ? c.income : !c.income);
  $('#fcats').innerHTML = cats.map(c => `<button type="button" class="chip" data-action="fcat" data-id="${c.id}" aria-pressed="${F.cat === c.id}"><i class="dot" style="background:${c.color}"></i>${esc(c.name)}</button>`).join('');
  document.querySelectorAll('.typesw button').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === (keep.type === 'in' ? 'in' : 'out')));
  document.querySelector('.splitbox').previousElementSibling.textContent = keep.type === 'in' ? 'De quem é a entrada' : 'Rateio: para quem foi esse gasto';
  renderSplit();
}
function showText(txt){
  $('#modal').innerHTML = `<div class="scrim" data-action="close"><div class="sheet" role="dialog" aria-modal="true"><h2>Resumo do período</h2><p class="muted" style="margin:0">Selecione e copie o texto abaixo.</p><textarea id="sumtxt" rows="12" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);font:inherit">${esc(txt)}</textarea><div class="chips" style="justify-content:flex-end"><button class="btn" data-action="close">Fechar</button></div></div></div>`;
  const ta = $('#sumtxt'); ta.focus(); ta.select();
}

document.addEventListener('input', ev => {
  const t = ev.target;
  if (F && t.id === 'famount'){ F.amount = t.value; renderSplit(); return; }
  if (F && t.dataset.split){ F.split[t.dataset.split] = Math.max(0, +t.value || 0); const keepFocus = t.dataset.split; renderSplit(); const n = document.querySelector(`[data-split="${keepFocus}"]`); if (n){ n.focus(); const v = n.value; n.value = ''; n.value = v; } return; }
  if (t.id === 'fq'){ S.filter.q = t.value; $('#txList').innerHTML = txListHTML(); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (handleImportChange(t)) return;
  if (t.id === 'restoreFile'){ if (t.files[0]) readBackup(t.files[0]); t.value = ''; return; }
  const map = {fm:'month', fc:'cat', fp:'person', ft:'type'};
  if (map[t.id]){ S.filter[map[t.id]] = t.value; $('#txList').innerHTML = txListHTML(); return; }
  const k = t.dataset.set; if (!k) return; const i = +t.dataset.i;
  if (k === 'mname') S.settings.members[i].name = t.value.trim() || 'Sem nome';
  if (k === 'mrole') S.settings.members[i].role = t.value;
  if (k === 'mcolor') S.settings.members[i].color = t.value;
  if (k === 'cname') S.settings.categories[i].name = t.value.trim() || 'Sem nome';
  if (k === 'ccolor') S.settings.categories[i].color = t.value;
  if (k === 'cbudget'){ const v = parseMoney(t.value); S.settings.categories[i].budget = isFinite(v) ? v : 0; }
  if (k === 'rmatch') S.settings.rules[i].match = clean(t.value);
  if (k === 'rcat') S.settings.rules[i].cat = t.value;
  if (k === 'rwho') S.settings.rules[i].who = t.value || null;
  saveSettings(); toast('Alteração salva.');
});
document.addEventListener('submit', ev => {
  if (ev.target.id !== 'txForm') return; ev.preventDefault();
  readFormFields(); const err = $('#ferr');
  const amount = parseMoney(F.amount);
  const fail = m => { err.textContent = m; err.hidden = false; };
  if (!(amount > 0)) return fail('Informe um valor maior que zero, por exemplo 25,90.');
  if (!F.date) return fail('Escolha a data do lançamento.');
  if (!F.cat) return fail('Escolha uma categoria.');
  const split = {}; Object.entries(F.split).forEach(([k, v]) => { if (+v > 0) split[k] = +v; });
  if (!Object.keys(split).length) return fail('Escolha ao menos uma pessoa no rateio.');
  const prev = S.entries.find(e => e.id === F.id);
  const e = {id:F.id, kind:'entry', type:F.type, date:F.date, desc:F.desc.trim(), cat:F.cat, amount, pay:F.pay, split, createdAt: prev?.createdAt || new Date().toISOString()};
  if (prev?.sample) e.sample = true;
  closeForm(); putEntry(e); toast(prev ? 'Lançamento atualizado.' : `Lançado: ${money(amount)}.`);
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && $('#modal').innerHTML) closeForm(); });

const dropZone = ev => ev.target.closest ? ev.target.closest('#drop') : null;
document.addEventListener('dragover', ev => { const d = dropZone(ev); if (d){ ev.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', ev => { const d = dropZone(ev); if (d) d.classList.remove('over'); });
document.addEventListener('drop', ev => { const d = dropZone(ev); if (d){ ev.preventDefault(); d.classList.remove('over'); const f = ev.dataTransfer.files[0]; if (f) readImportFile(f); } });

const h = (location.hash || '').slice(1); if (VIEWS.some(([k]) => k === h)) S.view = h;
render();
bootNative().then(initStore);
// app instalável: funciona sem internet e pede ao navegador para não apagar os dados
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}
(function installHint(){
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  let off = false; try { off = localStorage.getItem('gna-dica-instalar') === '1'; } catch {}
  if (!ios || standalone || off) return;
  const b = document.createElement('div'); b.className = 'install-hint';
  b.innerHTML = '<span>Para usar como app: toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>.</span><button class="icon-btn" aria-label="Fechar aviso">✕</button>';
  b.querySelector('button').onclick = () => { b.remove(); try { localStorage.setItem('gna-dica-instalar', '1'); } catch {} };
  document.body.appendChild(b);
})();
</script>
